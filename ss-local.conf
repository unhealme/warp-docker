{
  "fast_open": true,
  "ipv6_first": true,
  "ipv6_only": false,
  "locals": [
    {
      "local_address": "::",
      "local_port": 1080,
      "protocol": "socks"
    }
  ],
  "log": {
    "format": {
      "without_time": false
    },
    "level": 1,
    "writers": [
      {
        "console": {}
      }
    ]
  },
  "mode": "tcp_and_udp",
  "mptcp": true,
  "no_delay": true,
  "runtime": {
    "mode": "multi_thread",
    "worker_count": 10
  }
}
